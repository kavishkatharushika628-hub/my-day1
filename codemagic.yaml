workflows:
  android-workflow:
    name: My Day Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Build My Day APK
        script: |
          curl -L https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-9.3.1/bin/gradle assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
